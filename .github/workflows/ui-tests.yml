name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [host, native]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v1
      - uses: DeterminateSystems/magic-nix-cache-action@v1

      - name: Run UI smoke test (${{ matrix.mode }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          headless: true
          script: |
            nix develop --command bash -lc "scripts/test-e2e.sh --mode ${{ matrix.mode }} --with-ui"
