name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android:
    runs-on: [self-hosted, nixos, hetzner, zmp]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [host, native]
    steps:
      - name: Enforce temporary PR author restriction
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'justinmoon' }}
        run: |
          echo "CI currently runs only for PRs opened by @justinmoon." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Verify nix installation
        run: nix --version

      - name: Provide unzip/adb in PATH
        run: |
          set -eu
          TOOL_DIR="$RUNNER_TEMP/zmp-tools"
          mkdir -p "$TOOL_DIR"
          ADB_BIN="$(nix shell --accept-flake-config nixpkgs#android-tools -c command -v adb)"
          UNZIP_BIN="$(nix shell --accept-flake-config nixpkgs#unzip -c command -v unzip)"
          ln -sf "$UNZIP_BIN" "$TOOL_DIR/unzip"
          cat <<'EOS' > "$TOOL_DIR/adb"
#!/usr/bin/env bash
ADB_BIN="__ADB_BIN__"
if [[ "$1" == "-s" && "$3" == "emu" && "$4" == "kill" ]]; then
  "$ADB_BIN" "$@" >/dev/null 2>&1 || true
  exit 0
fi
exec "$ADB_BIN" "$@"
EOS
          sed -i "s#__ADB_BIN__#$ADB_BIN#g" "$TOOL_DIR/adb"
          chmod +x "$TOOL_DIR"/adb
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

      - name: Run UI smoke test (${{ matrix.mode }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          emulator-options: "-no-window -no-audio -gpu swiftshader_indirect -no-snapshot"
          emulator-boot-timeout: 600000
          script: |
            nix develop --command bash -lc "scripts/test-e2e.sh --mode ${{ matrix.mode }}"
