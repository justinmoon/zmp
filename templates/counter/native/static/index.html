<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZMP Counter</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6fb;
      }
      main {
        width: min(420px, 90vw);
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .subtitle {
        margin: 0 0 24px;
        color: #5b6475;
        font-size: 16px;
      }
      #count {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 24px;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a.button {
        flex: 1 1 140px;
        text-align: center;
        padding: 12px 0;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      a.button.primary {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: #ffffff;
      }
      a.button.secondary {
        background: #e4e7ef;
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ZMP Counter</h1>
      <p class="subtitle">Zig-driven server rendered UI</p>
      <p id="count">Count: <span id="count-value">{{COUNT}}</span></p>
      <div class="actions">
        <a id="inc" class="button primary" href="#">Increment</a>
        <a id="dec" class="button secondary" href="#">Decrement</a>
      </div>
    </main>
    <script>
      function extractCount(html) {
        const marker = 'id="count-value"';
        const idx = html.indexOf(marker);
        if (idx === -1) return null;
        const start = html.indexOf('>', idx);
        if (start === -1) return null;
        const end = html.indexOf('<', start + 1);
        if (end === -1) return null;
        return html.slice(start + 1, end).trim();
      }

      async function updateCounter(path) {
        try {
          const res = await fetch(path, { credentials: 'omit' });
          const text = await res.text();
          const value = extractCount(text);
          if (value !== null) {
            document.getElementById('count-value').textContent = value;
          }
        } catch (err) {
          console.error('counter update failed', err);
        }
      }

      document.getElementById('inc').addEventListener('click', (ev) => {
        ev.preventDefault();
        updateCounter('/inc');
      });

      document.getElementById('dec').addEventListener('click', (ev) => {
        ev.preventDefault();
        updateCounter('/dec');
      });
    </script>
  </body>
</html>
