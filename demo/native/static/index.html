<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZMP Counter</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f6f9;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin-top: 0;
        font-size: 28px;
      }
      a.button {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      p#count {
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ZMP Counter</h1>
      <p id="count">Count: {{COUNT}}</p>
      <a class="button" href="/inc">Increment</a>
    </main>
  </body>
</html>
